<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebFlux Demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --text: #e8e8e8;
    --muted: #555;
    --stage1: #e05252;
    --stage2: #52b788;
    --stage3: #5e9bdb;
    --accent: #f0c040;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 28px 48px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .logo span {
    color: var(--accent);
  }

  .stage-tabs {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .tab {
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .tab:hover { color: var(--text); border-color: #333; }

  .tab.active[data-stage="1"] { background: var(--stage1); border-color: var(--stage1); color: #fff; }
  .tab.active[data-stage="2"] { background: var(--stage2); border-color: var(--stage2); color: #0a0a0a; }
  .tab.active[data-stage="3"] { background: var(--stage3); border-color: var(--stage3); color: #fff; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
  }

  .left-panel {
    border-right: 1px solid var(--border);
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .stage-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stage-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stage-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
  }

  .stage-title.s1 { color: var(--stage1); }
  .stage-title.s2 { color: var(--stage2); }
  .stage-title.s3 { color: var(--stage3); }

  .stage-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  .flow-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 2;
  }

  .flow-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    transition: color 0.3s;
  }

  .flow-line.active { color: var(--text); }
  .flow-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s; }
  .flow-line.active .dot { background: var(--accent); }
  .flow-line.parallel.active .dot { background: var(--stage2); }

  .product-select {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .select-label {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
  }

  .product-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
    background: transparent;
  }

  .pill:hover { border-color: #444; color: var(--text); }
  .pill.active { border-color: var(--accent); color: var(--accent); }

  .fetch-btn {
    padding: 14px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .fetch-btn[data-stage="1"] { background: var(--stage1); color: #fff; }
  .fetch-btn[data-stage="2"] { background: var(--stage2); color: #0a0a0a; }
  .fetch-btn[data-stage="3"] { background: var(--stage3); color: #fff; }
  .fetch-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .fetch-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .right-panel {
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .timer-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .timer-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .timer-display {
    font-family: 'DM Mono', monospace;
    font-size: 72px;
    font-weight: 500;
    line-height: 1;
    transition: color 0.3s;
    color: var(--text);
  }

  .timer-display.running { color: var(--accent); }
  .timer-display.done-1 { color: var(--stage1); }
  .timer-display.done-2 { color: var(--stage2); }
  .timer-display.done-3 { color: var(--stage3); }

  .timer-unit {
    font-size: 18px;
    color: var(--muted);
    margin-left: 4px;
  }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 100%;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .progress-bar.s1 { background: var(--stage1); }
  .progress-bar.s2 { background: var(--stage2); }
  .progress-bar.s3 { background: var(--stage3); }

  .history {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .history-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
  }

  .history-badge.s1 { background: rgba(224,82,82,0.15); color: var(--stage1); }
  .history-badge.s2 { background: rgba(82,183,136,0.15); color: var(--stage2); }
  .history-badge.s3 { background: rgba(94,155,219,0.15); color: var(--stage3); }

  .history-ms { margin-left: auto; font-weight: 500; }
  .history-ms.s1 { color: var(--stage1); }
  .history-ms.s2 { color: var(--stage2); }
  .history-ms.s3 { color: var(--stage3); }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: none;
    flex-direction: column;
    gap: 16px;
    animation: fadeIn 0.4s ease;
  }

  .product-card.visible { display: flex; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-name {
    font-size: 20px;
    font-weight: 700;
  }

  .card-price {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: var(--accent);
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .card-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 500;
  }

  .elapsed-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    align-self: flex-start;
  }

  .elapsed-badge.s1 { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.3); color: var(--stage1); }
  .elapsed-badge.s2 { background: rgba(82,183,136,0.1); border: 1px solid rgba(82,183,136,0.3); color: var(--stage2); }
  .elapsed-badge.s3 { background: rgba(94,155,219,0.1); border: 1px solid rgba(94,155,219,0.3); color: var(--stage3); }

  .error-msg {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--stage1);
    padding: 12px;
    background: rgba(224,82,82,0.08);
    border: 1px solid rgba(224,82,82,0.2);
    border-radius: 6px;
    display: none;
  }

  .divider { height: 1px; background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">fisa-be-seminar / <span>webflux-demo</span></div>
  <div class="stage-tabs">
    <button class="tab active" data-stage="1" onclick="switchStage(1)">Stage 1</button>
    <button class="tab" data-stage="2" onclick="switchStage(2)">Stage 2</button>
    <button class="tab" data-stage="3" onclick="switchStage(3)">Stage 3</button>
  </div>
</header>

<main>
  <div class="left-panel">
    <div class="stage-info">
      <div class="stage-label">현재 스테이지</div>
      <div class="stage-title s1" id="stageTitle">REST MVC<br>순차 호출</div>
      <div class="stage-desc" id="stageDesc">
        inventory → review → shop 순서로 순차 호출.<br>
        응답시간 = 각 서비스 응답시간의 <strong>합</strong>.
      </div>
    </div>

    <div class="flow-diagram" id="flowDiagram">
      <div class="flow-line active" id="fl-product">
        <div class="dot"></div>product-service
      </div>
      <div class="flow-line" id="fl-inv" style="padding-left:16px">
        <div class="dot"></div>→ inventory (500ms)
      </div>
      <div class="flow-line" id="fl-rev" style="padding-left:16px">
        <div class="dot"></div>→ review (300ms)
      </div>
      <div class="flow-line" id="fl-shop" style="padding-left:16px">
        <div class="dot"></div>→ shop (400ms)
      </div>
    </div>

    <div class="product-select">
      <div class="select-label">상품 선택</div>
      <div class="product-pills">
        <button class="pill active" onclick="selectProduct(1, this)">떡볶이 세트</button>
        <button class="pill" onclick="selectProduct(2, this)">치킨 한 마리</button>
        <button class="pill" onclick="selectProduct(3, this)">짜장면</button>
        <button class="pill" onclick="selectProduct(4, this)">피자 L사이즈</button>
        <button class="pill" onclick="selectProduct(5, this)">초밥 세트</button>
      </div>
    </div>

    <button class="fetch-btn" data-stage="1" id="fetchBtn" onclick="fetchProduct()">
      상품 조회하기
    </button>
  </div>

  <div class="right-panel">
    <div class="timer-section">
      <div class="timer-label">응답시간</div>
      <div class="timer-display" id="timerDisplay">
        0<span class="timer-unit">ms</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar s1" id="progressBar"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="product-card" id="productCard">
      <div class="card-header">
        <div class="card-name" id="cardName">—</div>
        <div class="card-price" id="cardPrice">—</div>
      </div>
      <div class="card-desc" id="cardDesc">—</div>
      <div class="card-grid">
        <div class="card-stat">
          <div class="stat-label">재고</div>
          <div class="stat-value" id="cardStock">—</div>
        </div>
        <div class="card-stat">
          <div class="stat-label">평점</div>
          <div class="stat-value" id="cardRating">—</div>
        </div>
        <div class="card-stat">
          <div class="stat-label">리뷰</div>
          <div class="stat-value" id="cardReview">—</div>
        </div>
        <div class="card-stat">
          <div class="stat-label">가게</div>
          <div class="stat-value" id="cardShop">—</div>
        </div>
        <div class="card-stat">
          <div class="stat-label">카테고리</div>
          <div class="stat-value" id="cardCategory">—</div>
        </div>
        <div class="card-stat">
          <div class="stat-label">영업</div>
          <div class="stat-value" id="cardOpen">—</div>
        </div>
      </div>
      <div class="elapsed-badge s1" id="elapsedBadge">서버 측정: —ms</div>
    </div>

    <div class="history">
      <div class="history-label">조회 기록</div>
      <div id="historyList"></div>
    </div>
  </div>
</main>

<script>
  let currentStage = 1;
  let currentProductId = 1;
  let timerInterval = null;
  let startTime = null;

  const STAGE_CONFIG = {
    1: {
      title: 'REST MVC<br>순차 호출',
      desc: 'inventory → review → shop 순서로 순차 호출.<br>응답시간 = 각 서비스 응답시간의 <strong>합</strong>.',
      color: 'stage1',
      cls: 's1',
      maxMs: 1500,
    },
    2: {
      title: 'WebFlux<br>병렬 호출',
      desc: 'Mono.zip으로 inventory, review, shop 동시 호출.<br>응답시간 = 각 서비스 응답시간의 <strong>max</strong>.',
      color: 'stage2',
      cls: 's2',
      maxMs: 700,
    },
    3: {
      title: 'WebFlux<br>boundedElastic',
      desc: 'inventory는 blocking → boundedElastic 격리.<br>review, shop은 WebClient 유지.',
      color: 'stage3',
      cls: 's3',
      maxMs: 700,
    },
  };

  function switchStage(stage) {
    currentStage = stage;
    const cfg = STAGE_CONFIG[stage];

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-stage="${stage}"]`).classList.add('active');

    document.getElementById('stageTitle').className = `stage-title s${stage}`;
    document.getElementById('stageTitle').innerHTML = cfg.title;
    document.getElementById('stageDesc').innerHTML = cfg.desc;

    const btn = document.getElementById('fetchBtn');
    btn.dataset.stage = stage;
    btn.textContent = '상품 조회하기';

    const pb = document.getElementById('progressBar');
    pb.className = `progress-bar s${stage}`;
    pb.style.width = '0%';

    document.getElementById('timerDisplay').className = 'timer-display';
    document.getElementById('timerDisplay').innerHTML = '0<span class="timer-unit">ms</span>';
    document.getElementById('productCard').classList.remove('visible');
    document.getElementById('errorMsg').style.display = 'none';

    updateFlowDiagram(stage, null);
  }

  function selectProduct(id, el) {
    currentProductId = id;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }

  function updateFlowDiagram(stage, activeStep) {
    const lines = ['fl-product', 'fl-inv', 'fl-rev', 'fl-shop'];
    lines.forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('active', 'parallel');
    });

    if (activeStep === null) {
      document.getElementById('fl-product').classList.add('active');
      return;
    }

    document.getElementById('fl-product').classList.add('active');

    if (stage === 1) {
      if (activeStep >= 1) document.getElementById('fl-inv').classList.add('active');
      if (activeStep >= 2) document.getElementById('fl-rev').classList.add('active');
      if (activeStep >= 3) document.getElementById('fl-shop').classList.add('active');
    } else {
      ['fl-inv', 'fl-rev', 'fl-shop'].forEach(id => {
        document.getElementById(id).classList.add('active', 'parallel');
      });
    }
  }

  async function fetchProduct() {
    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    document.getElementById('productCard').classList.remove('visible');
    document.getElementById('errorMsg').style.display = 'none';

    const cfg = STAGE_CONFIG[currentStage];
    const timerEl = document.getElementById('timerDisplay');
    const pb = document.getElementById('progressBar');

    timerEl.className = 'timer-display running';
    pb.style.width = '0%';

    startTime = Date.now();

    if (currentStage === 1) {
      let step = 0;
      updateFlowDiagram(1, 0);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        timerEl.innerHTML = `${elapsed}<span class="timer-unit">ms</span>`;
        pb.style.width = Math.min((elapsed / cfg.maxMs) * 100, 100) + '%';

        if (elapsed > 500 && step < 1) { step = 1; updateFlowDiagram(1, 1); }
        if (elapsed > 800 && step < 2) { step = 2; updateFlowDiagram(1, 2); }
        if (elapsed > 1100 && step < 3) { step = 3; updateFlowDiagram(1, 3); }
      }, 30);
    } else {
      updateFlowDiagram(currentStage, 1);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        timerEl.innerHTML = `${elapsed}<span class="timer-unit">ms</span>`;
        pb.style.width = Math.min((elapsed / cfg.maxMs) * 100, 100) + '%';
      }, 30);
    }

    try {
      const res = await fetch(`http://localhost:8080/product/${currentProductId}`);
      clearInterval(timerInterval);

      const elapsed = Date.now() - startTime;
      timerEl.innerHTML = `${elapsed}<span class="timer-unit">ms</span>`;
      timerEl.className = `timer-display done-${currentStage}`;
      pb.style.width = '100%';

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      renderCard(data);
      addHistory(currentStage, data.elapsedMs || elapsed);
    } catch (e) {
      clearInterval(timerInterval);
      const elapsed = Date.now() - startTime;
      timerEl.innerHTML = `${elapsed}<span class="timer-unit">ms</span>`;
      timerEl.className = 'timer-display done-1';
      document.getElementById('errorMsg').textContent = `오류: ${e.message} — 서비스가 실행 중인지 확인하세요.`;
      document.getElementById('errorMsg').style.display = 'block';
    }

    btn.disabled = false;
  }

  function renderCard(data) {
    document.getElementById('cardName').textContent = data.name;
    document.getElementById('cardPrice').textContent = data.price.toLocaleString() + '원';
    document.getElementById('cardDesc').textContent = data.description;
    document.getElementById('cardStock').textContent = `${data.stock}개 (${data.stockStatus})`;
    document.getElementById('cardRating').textContent = `⭐ ${data.rating}`;
    document.getElementById('cardReview').textContent = `${data.reviewCount}개`;
    document.getElementById('cardShop').textContent = data.shopName;
    document.getElementById('cardCategory').textContent = data.category;
    document.getElementById('cardOpen').textContent = data.shopOpen ? '🟢 영업중' : '🔴 마감';

    const badge = document.getElementById('elapsedBadge');
    badge.className = `elapsed-badge s${currentStage}`;
    badge.textContent = `서버 측정: ${data.elapsedMs}ms`;

    document.getElementById('productCard').classList.add('visible');
  }

  function addHistory(stage, ms) {
    const cfg = STAGE_CONFIG[stage];
    const labels = { 1: 'REST-MVC', 2: 'PARALLEL', 3: 'BOUNDED' };
    const list = document.getElementById('historyList');
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <span class="history-badge s${stage}">${labels[stage]}</span>
      <span>상품 #${currentProductId}</span>
      <span class="history-ms s${stage}">${ms}ms</span>
    `;
    list.insertBefore(item, list.firstChild);
    if (list.children.length > 8) list.removeChild(list.lastChild);
  }
</script>
</body>
</html>
